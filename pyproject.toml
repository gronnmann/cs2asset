[project]
name = "cs2asset"
version = "0.3.5"
description = "Convert local and provider textures, HDR skies, and static models into CS2 Hammer resources"
readme = "README.md"
requires-python = ">=3.12,<3.14"
dependencies = ["typer>=0.16,<1", "rich>=14,<15", "httpx>=0.28,<1", "numpy>=2,<3", "OpenImageIO>=3,<4", "platformdirs>=4,<5", "vdf>=3.4,<4", "filelock>=3,<4"]

[project.scripts]
cs2asset = "cs2asset.cli:app"

[project.urls]
Homepage = "https://github.com/gronnmann/cs2asset"
Repository = "https://github.com/gronnmann/cs2asset"
Issues = "https://github.com/gronnmann/cs2asset/issues"

[build-system]
requires = ["uv_build>=0.9,<0.10"]
build-backend = "uv_build"

[dependency-groups]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires local CS2 Workshop Tools and/or Blender"]

[tool.ruff]
target-version = "py312"
line-length = 100
