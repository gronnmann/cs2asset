name: Publish to PyPI

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: read

concurrency:
  group: publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v7
        with:
          python-version: '3.12'
      - name: Install dependencies
        run: uv sync --locked
      - name: Check release version
        shell: python
        run: |
          import os
          import tomllib
          from pathlib import Path
          import ast

          version = tomllib.loads(Path('pyproject.toml').read_text())['project']['version']
          assert os.environ['GITHUB_REF_NAME'] == f'v{version}', 'Tag must match package version'
          module = ast.parse(Path('src/cs2asset/__init__.py').read_text())
          runtime_version = next(
              ast.literal_eval(node.value)
              for node in module.body
              if isinstance(node, ast.Assign)
              and any(isinstance(target, ast.Name) and target.id == '__version__' for target in node.targets)
          )
          assert runtime_version == version, 'Runtime version must match package version'
      - name: Test
        run: uv run --locked pytest -q
      - name: Lint
        run: uv run --locked ruff check src tests scripts
      - name: Build
        run: uv build
      - name: Check package metadata
        run: uvx twine check dist/*
      - uses: actions/upload-artifact@v4
        with:
          name: distributions
          path: dist/
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/cs2asset
    permissions:
      id-token: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: distributions
          path: dist/
      - name: Publish to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
